name: build

# 两种模式：
#   1. push 到 main          —— 只构建并上传 artifact（CI 验证 + 取最新版用）。
#   2. 手动 workflow_dispatch —— 注入版本号构建，并发布 GitHub Release（打 tag + 上传安装包）。
#
# 版本号由 scripts/version.mjs 从 git 历史推导：最近的 vMAJOR.MINOR.PATCH 基线 tag
# 之后的提交数即为 patch。新打 v1.1.0 / v2.0.0 tag 即开始新 minor/major 线，patch 归零重算。
# 详见 README「版本管理」一节。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同分支新推送取消旧构建；按事件类型分组，避免 push 误取消正在跑的 release。
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3+)
          - platform: macos-latest
            name: macos-aarch64
            args: '--target aarch64-apple-darwin'
            rustTarget: aarch64-apple-darwin
          # Intel Mac
          - platform: macos-latest
            name: macos-x86_64
            args: '--target x86_64-apple-darwin'
            rustTarget: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            name: windows-x86_64
            args: ''
            rustTarget: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 发版需要完整历史 + tag 来推导版本；普通 push 用浅克隆加速。
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 仅发版时：把推导出的版本号（如 1.0.3）写回三个版本文件，使安装包文件名带上版本。
      # 仓库内提交的版本文件始终是基线（1.0.0），这里只是 CI 临时覆盖，不回写仓库。
      - name: Compute & inject version (release only)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/version.mjs --write

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ydisks-transfer-assistant-${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 仅手动触发：等三平台构建完成后，汇总安装包打 tag + 发 Release。
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Compute version
        id: version
        run: node scripts/version.mjs

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create tag & release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to release."
            exit 0
          fi
          # 只发布各平台安装包（.dmg / .msi / .exe）+ macOS 首次打开修复脚本；.app 已包含在 .dmg 内。
          FILES=$(find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) | sort)
          if [ -z "$FILES" ]; then
            echo "No installer artifacts found; aborting release."
            exit 1
          fi
          chmod +x scripts/macos-unblock.command
          echo "Creating $TAG with:"
          echo "$FILES"
          echo "scripts/macos-unblock.command"
          gh release create "$TAG" $FILES scripts/macos-unblock.command \
            -R "$REPO" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
